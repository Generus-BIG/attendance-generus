<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <title>Presentation navigation check</title>
  </head>
  <body>
    <pre id="result">Running…</pre>
    <script type="module">
      // Open through Vite; tests real DOM targets without a browser test dependency.
      import React from 'react'
      import { createRoot } from 'react-dom/client'
      import {
        getMouseNavigationDirection,
        getSlideNavigationDirection,
        getSwipeNavigationDirection,
        isNavigationExcluded,
      } from './navigation.ts'
      import { PresentationPlayer } from './player.tsx'
      import '/src/styles/index.css'

      const assert = (condition, message) => {
        if (!condition) throw new Error(message)
      }
      try {
        const bounds = { left: 100, width: 640 }
        assert(
          getMouseNavigationDirection(false, 730, bounds, 1, 3) === 0,
          'Non-fullscreen mouse click ignored'
        )
        assert(
          getMouseNavigationDirection(true, 730, bounds, 1, 3) === 1,
          'Fullscreen mouse click navigates'
        )
        assert(
          getSlideNavigationDirection(110, bounds, 1, 3) === -1,
          'Scaled left half'
        )
        assert(
          getSlideNavigationDirection(420, bounds, 1, 3) === 1,
          'Midpoint belongs to next'
        )
        assert(
          getSlideNavigationDirection(730, bounds, 1, 3) === 1,
          'Scaled right half'
        )
        for (const x of [99, 741])
          assert(
            getSlideNavigationDirection(x, bounds, 1, 3) === 0,
            'Letterbox ignored'
          )
        assert(
          getSlideNavigationDirection(110, bounds, 0, 3) === 0,
          'First slide cannot go back'
        )
        assert(
          getSlideNavigationDirection(730, bounds, 2, 3) === 0,
          'Last slide cannot advance'
        )
        assert(
          getSlideNavigationDirection(730, bounds, 0, 0) === 0,
          'Empty deck'
        )
        const canvas = document.createElement('div')
        document.body.append(canvas)
        canvas.innerHTML =
          '<p>Ordinary text</p><table><tbody><tr><td>Table</td></tr></tbody></table><article class="card"><img alt="Photo"><span>Caption</span></article><button><span>Button child</span></button><input type="range"><a href="#">Link</a><select></select><textarea></textarea><label>Label</label><details><summary>Summary</summary></details><div contenteditable="true">Edit</div><div role="dialog"><p>Dialog</p></div><div role="menu">Menu</div><div role="listbox">Listbox</div><div role="combobox">Combobox</div><div role="slider">Slider</div><div role="button">Button role</div><div role="checkbox">Checkbox</div><div role="radio">Radio</div><div role="switch">Switch</div><div role="tab">Tab</div><div role="spinbutton">Spinbutton</div><div role="tree">Tree</div><div role="treeitem">Tree item</div><div data-radix-popper-content-wrapper>Popover</div><div class="recharts-wrapper"><svg><path /></svg></div><div style="overflow-y:auto;height:20px"><p style="height:80px">Scroll</p></div><div data-presentation-no-navigation>Custom control</div>'
        assert(
          !isNavigationExcluded(canvas.firstChild, canvas),
          'Plain text should navigate'
        )
        for (const selector of [
          'td',
          '.card',
          'img',
          '.card span',
          '[style] p',
        ])
          assert(
            !isNavigationExcluded(canvas.querySelector(selector), canvas),
            `Ordinary content should navigate: ${selector}`
          )
        for (const selector of [
          'button span',
          'input',
          'a',
          'select',
          'textarea',
          'label',
          'summary',
          '[contenteditable]',
          '[role="dialog"] p',
          '[role="menu"]',
          '[role="listbox"]',
          '[role="combobox"]',
          '[role="slider"]',
          '[role="button"]',
          '[role="checkbox"]',
          '[role="radio"]',
          '[role="switch"]',
          '[role="tab"]',
          '[role="spinbutton"]',
          '[role="tree"]',
          '[role="treeitem"]',
          '[data-radix-popper-content-wrapper]',
          'path',
          '[data-presentation-no-navigation]',
        ]) {
          assert(
            isNavigationExcluded(canvas.querySelector(selector), canvas),
            `Exclude ${selector}`
          )
        }
        assert(
          getSwipeNavigationDirection(100, 40, 3, 0, 3) === 1,
          'Swipe left advances'
        )
        assert(
          getSwipeNavigationDirection(40, 100, 3, 1, 3) === -1,
          'Swipe right returns'
        )
        for (const [startX, endX, startY, endY] of [
          [100, 53, 0, 0],
          [100, 40, 0, 80],
        ])
          assert(
            getSwipeNavigationDirection(startX, endX, startY, endY, 1, 3) === 0,
            'Short or vertical swipe ignored'
          )
        assert(
          getSwipeNavigationDirection(40, 100, 0, 0, 0, 3) === 0 &&
            getSwipeNavigationDirection(100, 40, 0, 0, 2, 3) === 0,
          'Swipe boundaries do not wrap'
        )
        canvas.remove()

        // Exercise the actual player as well as its coordinate/target rules.
        const host = document.createElement('div')
        document.body.append(host)
        const root = createRoot(host)
        const storedIntro = sessionStorage.getItem(
          'lupg:presentation-intro-seen'
        )
        const fullscreenElementDescriptor = Object.getOwnPropertyDescriptor(
          document,
          'fullscreenElement'
        )
        const fullscreenEnabledDescriptor = Object.getOwnPropertyDescriptor(
          document,
          'fullscreenEnabled'
        )
        const requestFullscreen = HTMLElement.prototype.requestFullscreen
        let fullscreenElement = null
        Object.defineProperties(document, {
          fullscreenElement: {
            configurable: true,
            get: () => fullscreenElement,
          },
          fullscreenEnabled: { configurable: true, value: true },
        })
        HTMLElement.prototype.requestFullscreen = function () {
          fullscreenElement = this
          document.dispatchEvent(new Event('fullscreenchange'))
          return Promise.resolve()
        }
        sessionStorage.setItem('lupg:presentation-intro-seen', 'true')
        const pause = (ms) => new Promise((resolve) => setTimeout(resolve, ms))
        const waitFor = async (check, message) => {
          for (let i = 0; i < 100; i++) {
            if (check()) return
            await pause(30)
          }
          throw new Error(message)
        }
        const current = () => {
          const match = host.textContent.match(/Slide (\d+) \/ /)
          return match ? String(Number(match[1]) - 1) : undefined
        }
        const clickCanvas = (side, target, pointerType = 'mouse') => {
          const stage = host.querySelector('[data-presentation-canvas]')
          const rect = stage.getBoundingClientRect()
          ;(target || stage).dispatchEvent(
            new PointerEvent('click', {
              bubbles: true,
              pointerType,
              clientX: rect.left + rect.width * side,
              clientY: rect.top + rect.height / 2,
            })
          )
        }
        const swipeCanvas = (
          startX,
          endX,
          startY = 100,
          endY = 100,
          target,
          pointerId = 1
        ) => {
          const stage = host.querySelector('[data-presentation-canvas]')
          const origin = target || stage
          origin.dispatchEvent(
            new PointerEvent('pointerdown', {
              bubbles: true,
              pointerType: 'touch',
              pointerId,
              clientX: startX,
              clientY: startY,
            })
          )
          origin.dispatchEvent(
            new PointerEvent('pointerup', {
              bubbles: true,
              pointerType: 'touch',
              pointerId,
              clientX: endX,
              clientY: endY,
            })
          )
        }
        root.render(
          React.createElement(PresentationPlayer, {
            monthKey: '2026-09',
            isLoading: false,
            slides: ['cover', 'mustin-check', 'middle', 'later', 'closing'].map(
              (key) => ({
                key,
                title: key,
                render: () =>
                  React.createElement(
                    'div',
                    { 'data-check-slide': key },
                    React.createElement('button', null, 'Interactive'),
                    React.createElement('input', {
                      'aria-label': 'Test input',
                    }),
                    React.createElement(
                      'div',
                      { className: 'recharts-wrapper' },
                      React.createElement(
                        'svg',
                        null,
                        React.createElement('path')
                      )
                    ),
                    React.createElement(
                      'div',
                      { style: { overflowY: 'auto', height: 20 } },
                      React.createElement(
                        'p',
                        { style: { height: 80 } },
                        'Scrollable'
                      )
                    )
                  ),
              })
            ),
          })
        )
        try {
          await waitFor(() => current() === '0', 'Player did not load')
          clickCanvas(0.25)
          await pause(50)
          assert(current() === '0', 'First slide must stay at first')
          clickCanvas(0.75, null, 'touch')
          await pause(50)
          assert(current() === '0', 'Touch taps must not navigate')
          clickCanvas(0.75)
          await pause(50)
          assert(current() === '0', 'Non-fullscreen click must not advance')
          swipeCanvas(100, 40)
          await waitFor(() => current() === '1', 'Swipe left must advance')
          await pause(250)
          swipeCanvas(100, 40)
          document.body.dispatchEvent(
            new KeyboardEvent('keydown', { key: 'End', bubbles: true })
          )
          host.querySelector('[data-slide-index="3"]').click()
          await pause(50)
          assert(
            current() === '1',
            'Swipe, End, and thumbnail remain locked during incoming transition'
          )
          await pause(1500)
          host.querySelector('[data-slide-index="2"]').click()
          await waitFor(
            () => current() === '2',
            'Thumbnail unlocks after transition'
          )
          await pause(100)
          swipeCanvas(100, 40)
          await pause(50)
          assert(current() === '2', 'Middle-slide swipe cannot skip')
          await pause(1500)
          document.body.dispatchEvent(
            new KeyboardEvent('keydown', { key: 'Home', bubbles: true })
          )
          await waitFor(() => current() === '0', 'Home key must remain active')
          await pause(1500)
          swipeCanvas(100, 40)
          await waitFor(
            () => current() === '1',
            'Swipe resumes after transition'
          )
          await waitFor(
            () =>
              host.querySelector(
                '[data-presentation-canvas] [data-check-slide="mustin-check"]'
              ),
            'Mustin transition must complete'
          )
          await pause(1500)
          const main = host.querySelector('[data-presentation-canvas]')
          swipeCanvas(100, 53)
          swipeCanvas(100, 40, 100, 180)
          main.dispatchEvent(
            new PointerEvent('pointerdown', {
              bubbles: true,
              pointerType: 'touch',
              pointerId: 10,
              clientX: 100,
              clientY: 100,
            })
          )
          main.dispatchEvent(
            new PointerEvent('pointerdown', {
              bubbles: true,
              pointerType: 'touch',
              pointerId: 11,
              clientX: 90,
              clientY: 100,
            })
          )
          main.dispatchEvent(
            new PointerEvent('pointerup', {
              bubbles: true,
              pointerType: 'touch',
              pointerId: 10,
              clientX: 20,
              clientY: 100,
            })
          )
          await pause(50)
          assert(current() === '1', 'Short, vertical, and multitouch ignored')
          host.querySelector('button[aria-label="Layar penuh"]').click()
          await waitFor(
            () => !host.querySelector('button[aria-label="Layar penuh"]'),
            'Player did not enter fullscreen'
          )
          const rect = main.getBoundingClientRect()
          main.dispatchEvent(
            new PointerEvent('pointermove', {
              bubbles: true,
              pointerType: 'mouse',
              clientX: rect.left + rect.width * 0.75,
            })
          )
          assert(
            main.dataset.navigation === 'next',
            'Fullscreen cursor direction'
          )
          const excludedButton = main.querySelector('button')
          excludedButton.dispatchEvent(
            new PointerEvent('pointermove', {
              bubbles: true,
              pointerType: 'mouse',
              clientX: rect.left + rect.width * 0.75,
            })
          )
          assert(
            main.dataset.navigation === 'none',
            'Excluded cursor is normal'
          )
          for (const target of main.querySelectorAll('button,input,path'))
            swipeCanvas(100, 40, 100, 100, target)
          await pause(50)
          assert(current() === '1', 'Controls and charts must not swipe')
          clickCanvas(0.75)
          await waitFor(() => current() === '2', 'Fullscreen click advances')
          await pause(250)
          clickCanvas(0.75)
          document.body.dispatchEvent(
            new KeyboardEvent('keydown', { key: 'End', bubbles: true })
          )
          await pause(50)
          assert(
            current() === '2',
            'Click and End remain locked during incoming transition'
          )
          await pause(1500)
          host.querySelector('button[aria-label="Slide sebelumnya"]').click()
          await waitFor(() => current() === '1', 'Footer previous must work')
          await pause(1500)
          clickCanvas(0.75, main.querySelector('button'))
          await pause(50)
          assert(current() === '1', 'Excluded fullscreen click ignored')
          swipeCanvas(100, 40, 100, 100, main.querySelector('p'))
          await waitFor(
            () => current() === '2',
            'Ordinary scroll content must swipe'
          )
          await pause(1500)
          host.querySelector('button[aria-label="Slide sebelumnya"]').click()
          await waitFor(() => current() === '1', 'Footer previous must work')
          await pause(1500)
          const input = main.querySelector('input')
          input.dispatchEvent(
            new KeyboardEvent('keydown', { key: 'ArrowRight', bubbles: true })
          )
          await pause(50)
          assert(current() === '1', 'Input must own its arrow keys')
          let toggles = 0
          const onToggle = () => {
            toggles++
          }
          window.addEventListener('lupg:mustin-toggle-autoscroll', onToggle)
          document.body.dispatchEvent(
            new KeyboardEvent('keydown', { key: ' ', bubbles: true })
          )
          assert(
            toggles === 1 && current() === '1',
            'Mustin Space must toggle scrolling'
          )
          window.removeEventListener('lupg:mustin-toggle-autoscroll', onToggle)
          document.body.dispatchEvent(
            new KeyboardEvent('keydown', { key: 'End', bubbles: true })
          )
          await waitFor(
            () => current() === '4',
            'End key must reach last slide'
          )
          await pause(1500)
          swipeCanvas(100, 40)
          await pause(50)
          assert(current() === '4', 'Last slide must not wrap')
          document.body.dispatchEvent(
            new KeyboardEvent('keydown', { key: 'Home', bubbles: true })
          )
          await waitFor(
            () => current() === '0',
            'Home key must reach first slide'
          )
          swipeCanvas(40, 100)
          await pause(50)
          assert(current() === '0', 'First slide must not wrap')
          fullscreenElement = null
          document.dispatchEvent(new Event('fullscreenchange'))
          await waitFor(
            () => host.querySelector('[data-slide-index="0"] [inert]'),
            'Thumbnails must be inert'
          )
          const thumbnail = host.querySelector('[data-slide-index="0"] [inert]')
          assert(
            getComputedStyle(thumbnail).containerType === 'size',
            'Thumbnail must have a size container'
          )

          const checkSmallDeck = async (count) => {
            root.render(
              React.createElement(PresentationPlayer, {
                monthKey: '2026-09',
                isLoading: false,
                slides: Array.from({ length: count }, (_, index) => ({
                  key: `small-${index}`,
                  title: `small-${index}`,
                  render: () => React.createElement('div', null, 'Small deck'),
                })),
              })
            )
            await pause(100)
            clickCanvas(0.75)
            swipeCanvas(100, 40)
            await pause(50)
            assert(current() === '0', `${count}-slide deck must not navigate`)
          }
          await checkSmallDeck(1)
          await checkSmallDeck(0)
        } finally {
          root.unmount()
          host.remove()
          if (storedIntro === null)
            sessionStorage.removeItem('lupg:presentation-intro-seen')
          else
            sessionStorage.setItem('lupg:presentation-intro-seen', storedIntro)
          if (fullscreenElementDescriptor)
            Object.defineProperty(
              document,
              'fullscreenElement',
              fullscreenElementDescriptor
            )
          else delete document.fullscreenElement
          if (fullscreenEnabledDescriptor)
            Object.defineProperty(
              document,
              'fullscreenEnabled',
              fullscreenEnabledDescriptor
            )
          else delete document.fullscreenEnabled
          if (requestFullscreen)
            HTMLElement.prototype.requestFullscreen = requestFullscreen
          else delete HTMLElement.prototype.requestFullscreen
        }
        document.getElementById('result').textContent =
          'PASS: fullscreen mouse rules; swipe threshold, direction, boundaries, exclusions, multitouch, scroll content; keyboard, footer and thumbnails'
      } catch (error) {
        document.getElementById('result').textContent = `FAIL: ${error.message}`
        throw error
      }
    </script>
  </body>
</html>
