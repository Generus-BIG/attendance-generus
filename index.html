<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="/images/favicon.svg"
      media="(prefers-color-scheme: light)"
    />
    <link
      rel="icon"
      type="image/svg+xml"
      href="/images/favicon_light.svg"
      media="(prefers-color-scheme: dark)"
    />
    <link
      rel="icon"
      type="image/png"
      href="/images/favicon.png"
      media="(prefers-color-scheme: light)"
    />
    <link
      rel="icon"
      type="image/png"
      href="/images/favicon_light.png"
      media="(prefers-color-scheme: dark)"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary Meta Tags -->
    <title>Generus Desa BIG - Admin Dashboard</title>
    <meta name="title" content="Generus Desa BIG - Admin Dashboard" />
    <meta
      name="description"
      content="Keep participant data, attendance tracking, absence records, and monthly reports organized in one dynamic dashboard."
    />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://generusbig.my.id" />
    <meta property="og:title" content="Generus Desa BIG - Admin Dashboard" />
    <meta
      property="og:description"
      content="Keep participant data, attendance tracking, absence records, and monthly reports organized in one dynamic dashboard."
    />
    <meta
      property="og:image"
      content="https://generusbig.my.id/images/og-preview.png"
    />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://generusbig.my.id" />
    <meta property="twitter:title" content="Generus Desa BIG - Admin Dashboard" />
    <meta
      property="twitter:description"
      content="Keep participant data, attendance tracking, absence records, and monthly reports organized in one dynamic dashboard."
    />
    <meta
      property="twitter:image"
      content="https://generusbig.my.id/images/og-preview.png"
    />

    <!-- Font families — baseline Geist + palette fonts (DM Sans, Outfit, Plus Jakarta Sans, Lora, JetBrains Mono, IBM Plex Mono) + Archivo Black (LUPG presentation display) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&family=Geist+Mono:wght@100..900&family=DM+Sans:wght@400;500;600;700&family=Outfit:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Lora:ital,wght@0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&family=Archivo+Black&display=swap"
      rel="stylesheet"
    />

    <meta name="theme-color" content="#fff" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
